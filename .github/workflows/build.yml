name: Build adblock rules
on:
  workflow_dispatch:
  schedule:
    - cron: '17 2 * * *'
  push:
    branches: [main]
    paths:
      - 'src/**'
      - 'tests/**'
      - 'config/**'
      - 'requirements.txt'
      - '.github/workflows/build.yml'
permissions:
  contents: write
concurrency:
  group: adblock-build
  cancel-in-progress: false
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install -r requirements.txt
      - run: python -m unittest discover -s tests -v
      - run: python src/build.py
      - name: Download official Mihomo binary
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          python - <<'PY'
          import json, os, urllib.request
          req=urllib.request.Request('https://api.github.com/repos/MetaCubeX/mihomo/releases/latest',headers={'Accept':'application/vnd.github+json','Authorization':'Bearer '+os.environ['GH_TOKEN']})
          data=json.load(urllib.request.urlopen(req,timeout=30))
          assets=[a for a in data['assets'] if a['name'].startswith('mihomo-linux-amd64-compatible-') and a['name'].endswith('.gz')]
          if not assets: raise SystemExit('No compatible Mihomo release asset; fail closed')
          urllib.request.urlretrieve(assets[0]['browser_download_url'],'/tmp/mihomo.gz')
          PY
          gzip -dc /tmp/mihomo.gz > /tmp/mihomo
          chmod +x /tmp/mihomo
      - name: Compile MRS
        run: |
          /tmp/mihomo convert-ruleset domain yaml dist/domain.yaml dist/domain.mrs
          if [ -f dist/ipcidr.yaml ]; then /tmp/mihomo convert-ruleset ipcidr yaml dist/ipcidr.yaml dist/ipcidr.mrs; fi
      - name: Read previous published statistics
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          curl --fail --location --silent --show-error \
            "https://raw.githubusercontent.com/${GITHUB_REPOSITORY}/rules/stats.json" \
            -o /tmp/previous-stats.json || rm -f /tmp/previous-stats.json
      - name: Validate before publish
        run: python src/validate.py --previous /tmp/previous-stats.json
      - name: Compile Xray GeoSite (ADBLOCK category)
        run: |
          python src/build_geosite.py --input dist/domain.yaml --output dist
          test -s dist/adblock.dat
          test -s dist/geosite.dat
      - name: Build summary
        run: |
          python - <<'PY'
          import json, os
          stats=json.load(open('dist/stats.json',encoding='utf-8'))
          lines=['## Adblock build statistics','','| Source | Input | Domain | IP | Classical | Duplicates | Allowlisted |','|---|---:|---:|---:|---:|---:|---:|']
          for name, d in stats.items():
              if name in ('output','allowlist_conflicts'): continue
              lines.append(f"| {name} | {d['input']} | {d['domain']} | {d['ip']} | {d['classical']} | {d['duplicate']} | {d['allowlisted']} |")
          lines.append('\nOutput: '+str(stats['output']))
          with open(os.environ['GITHUB_STEP_SUMMARY'],'a',encoding='utf-8') as f: f.write('\n'.join(lines)+'\n')
          PY
      - name: Publish rules branch
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cd dist
          git init
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add .
          git commit -m "Update rules from $GITHUB_SHA"
          git branch -M rules
          git remote add origin "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git"
          git push --force origin rules
